<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https:; img-src 'self' data:">
<title>חשבות בקליק</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#0E2650; --blue:#1E5BD8; --blue-d:#1747A8; --sky:#EDF4FF; --sky2:#DCE9FD; --line:#D6E3F7; --white:#fff;
  --muted:#5B6E8F; --ok:#0E8A5F; --ok-bg:#E4F6EE; --law:#1E5BD8; --law-bg:#E6EEFD;
  --warn:#9A6200; --warn-bg:#FFF3D6; --bad:#B3261E; --bad-bg:#FDE8E6;
  --r:10px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:16px}
body{margin:0;font-family:Heebo,system-ui,sans-serif;color:var(--ink);background:var(--white);line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.sr{position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* כניסה */
.login{min-block-size:100vh;display:grid;grid-template-columns:1fr 1fr}
.login-side{background:var(--ink);color:#fff;padding:56px;display:flex;flex-direction:column;justify-content:space-between}
.login-side h1{font-size:2.4rem;line-height:1.2;margin:0 0 16px;font-weight:700}
.login-side p{margin:0;max-inline-size:34ch;color:#BFD0F2;font-size:1.05rem}
.principle{border-inline-start:3px solid #6C9BFF;padding-inline-start:16px;color:#E7EEFF;font-size:1.15rem;max-inline-size:32ch}
.login-form{padding:56px;display:flex;align-items:center;justify-content:center}
.login-form form{inline-size:min(380px,100%);display:grid;gap:16px}
.login-form h2{margin:0 0 4px;font-size:1.5rem}
label{display:grid;gap:6px;font-weight:500;font-size:.95rem}
input,select,textarea{inline-size:100%;min-inline-size:0;padding:11px 12px;border:1px solid #B9CBEA;border-radius:8px;background:#fff;min-block-size:44px}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
.pform{gap:8px;margin-block-start:8px}.pform:not([hidden]){display:grid}
.rep-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-block-start:16px;display:grid;gap:12px}.rep-card h3{margin:0}.rep-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.rep-year{display:flex;align-items:center;gap:8px}.rep-details{border:1px solid var(--line);border-radius:10px;padding:8px 12px}.rep-details>summary,.rep-list>summary{cursor:pointer;font-weight:600}.rep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-block-start:10px}.rep-status{display:grid;gap:2px;padding:12px 14px;border-radius:10px}.rep-status.ok{background:#e8f6ee;color:#0f5132}.rep-status.warn{background:#fff6e0;color:#7a5200}.rep-list ul{margin:6px 0}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;align-items:stretch;margin-block-start:22px;position:relative}
.flow-step{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:10px;position:relative;box-shadow:0 1px 2px rgba(16,24,40,.05);transition:box-shadow .15s,transform .15s}.flow-step:hover{box-shadow:0 6px 18px rgba(16,24,40,.10);transform:translateY(-2px)}.flow-step .btn{margin-block-start:auto}.flow-step p{flex:1}
.flow-step h3{margin:0}.flow-step p{margin:0;color:var(--muted)}
.flow-n{inline-size:34px;block-size:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700}
.flow-arrow{display:none}
details>summary.nav{cursor:pointer;list-style:none}
@media (max-width:1100px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))}}@media (max-width:600px){.flow{grid-template-columns:1fr}}
.flowbar{display:flex;gap:8px;flex-wrap:wrap;margin-block-end:14px}.flowbar-i{padding:6px 12px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}.flowbar-i.on{background:var(--brand,#1f4fd8);color:#fff;border-color:transparent;font-weight:700}
.pick{list-style:none;padding:0;margin:10px 0;display:grid;gap:6px;max-block-size:320px;overflow:auto}.pick input{inline-size:auto;min-block-size:0}
.basis ul{margin:6px 0;padding-inline-start:18px}.basis li{margin-block-end:8px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:11px 20px;font-weight:600;cursor:pointer;min-block-size:44px}
.btn:hover{background:var(--blue-d)}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid var(--blue)}
.btn.ghost:hover{background:var(--sky)}
.btn.danger{background:#fff;color:var(--bad);border:1px solid var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkish{background:none;border:0;color:var(--blue);cursor:pointer;padding:0;text-decoration:underline;font-size:.95rem}
.err{background:var(--bad-bg);color:var(--bad);padding:10px 12px;border-radius:8px;font-size:.95rem}
.info{background:var(--sky);color:var(--ink);padding:10px 12px;border-radius:8px;font-size:.95rem}

/* מעטפת */
.app{display:grid;grid-template-columns:240px 1fr;min-block-size:100vh}
.rail{background:var(--ink);color:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;block-size:100vh}
.brand{font-weight:700;font-size:1.25rem;padding:4px 12px 20px}
.brand small{display:block;font-weight:400;color:#9DB4E6;font-size:.8rem}
.rail button.nav{background:none;border:0;color:#D3DFF7;text-align:start;padding:11px 12px;border-radius:8px;cursor:pointer;font-weight:500;min-block-size:44px}
.rail button.nav:hover{background:#18356F}
.rail button.nav[aria-current=page]{background:#fff;color:var(--ink);font-weight:700}
.rail .spacer{flex:1}
.rail .who{font-size:.85rem;color:#9DB4E6;padding:8px 12px}
main{padding:32px 40px 64px;min-inline-size:0}
.topline{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-block-end:24px}
h2.page{margin:0;font-size:1.7rem}
.fab{position:fixed;inset-block-end:18px;inset-inline-start:18px;z-index:50;background:#1f4fd8;color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
.trial{background:var(--warn-bg);color:var(--warn);padding:8px 14px;border-radius:8px;font-size:.9rem;margin-block-end:12px}
.demo{background:var(--warn-bg);color:var(--warn);padding:8px 14px;border-radius:8px;font-weight:600;font-size:.9rem}

/* טפסים בתוך מסכים */
.split>*{min-inline-size:0}
.split{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:32px;align-items:start}
fieldset{min-inline-size:0;border:0;border-block-start:1px solid var(--line);padding:16px 0 4px;margin:0 0 8px;display:grid;gap:12px}
legend{font-weight:700;padding:0 0 0 8px;color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* תלוש כספר חשבונות */
.slip{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.slip-head{background:var(--sky);padding:16px 20px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-block-end:1px solid var(--line)}
.slip-head strong{font-size:1.1rem}
.ledger{inline-size:100%;border-collapse:collapse}
.ledger th{font-weight:600;color:var(--muted);font-size:.85rem;text-align:start;padding:10px 20px;border-block-end:1px solid var(--line)}
.ledger td{padding:0;border-block-end:1px solid #EAF1FC}
.ledger tr.line button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:1fr auto;gap:12px;inline-size:100%;padding:13px 20px;cursor:pointer;align-items:center}
.ledger tr.line button:hover{background:#F7FAFF}
.ledger tr.line button:focus-visible{outline:3px solid var(--blue);outline-offset:-3px}
.lbl{display:flex;gap:10px;align-items:center}
.dot{inline-size:10px;block-size:10px;border-radius:50%;flex:none}
.s-ok .dot{background:var(--ok)} .s-law .dot{background:var(--law)} .s-warn .dot{background:#E39A00} .s-bad .dot{background:var(--bad)}
.amt{font-weight:600;font-size:1.02rem}
.amt.none{color:var(--bad);font-weight:600}
.note{padding:0 20px 14px 20px;color:var(--muted);font-size:.92rem;display:none}
.note.open{display:block}
.chip{display:inline-block;padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:600;white-space:nowrap}
.s-ok .chip{background:var(--ok-bg);color:var(--ok)} .s-law .chip{background:var(--law-bg);color:var(--law)}
.s-warn .chip{background:var(--warn-bg);color:var(--warn)} .s-bad .chip{background:var(--bad-bg);color:var(--bad)}
.net{display:flex;justify-content:space-between;align-items:baseline;padding:20px;background:var(--ink);color:#fff}
.net .big{font-size:2rem;font-weight:700}
.unres{margin:16px 0 0;padding:14px 18px;background:var(--bad-bg);color:var(--bad);border-radius:var(--r)}
.unres ul{margin:6px 0 0;padding-inline-start:20px}
.flags{margin:12px 0 0;padding:12px 18px;background:var(--warn-bg);color:var(--warn);border-radius:var(--r)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-block:16px;font-size:.88rem;color:var(--muted)}
.legend span{display:flex;gap:6px;align-items:center}

/* טבלאות כלליות */
table.t{inline-size:100%;border-collapse:collapse}
table.t th{text-align:start;color:var(--muted);font-size:.85rem;font-weight:600;padding:10px 12px;border-block-end:2px solid var(--line)}
table.t td{padding:12px;border-block-end:1px solid #EAF1FC;vertical-align:top}
table.t tr.click{cursor:pointer} table.t tr.click:hover{background:#F7FAFF}
.empty{padding:40px 20px;border:1px dashed #B9CBEA;border-radius:var(--r);text-align:center;color:var(--muted)}
.panel{border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-block-end:16px}
.fields{display:grid;grid-template-columns:max-content 1fr;gap:8px 20px;margin:0}
.fields dt{color:var(--muted)} .fields dd{margin:0;font-weight:500}
.actions{display:flex;gap:12px;flex-wrap:wrap;margin-block-start:16px;align-items:center}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400}
.check input{inline-size:auto;min-block-size:auto;margin-block-start:5px}
.toast{position:fixed;inset-block-end:24px;inset-inline-start:24px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;box-shadow:0 6px 24px rgba(14,38,80,.25)}
.secret{font-family:ui-monospace,monospace;background:var(--sky);padding:8px 12px;border-radius:8px;direction:ltr;text-align:left;user-select:all;word-break:break-all}

@media (max-width:900px){
  .login{grid-template-columns:1fr} .login-side{padding:28px}
  .app{grid-template-columns:1fr} .rail{position:static;block-size:auto;flex-direction:row;flex-wrap:wrap;padding:12px}
  .rail .spacer,.rail .who{display:none} .brand{padding:4px 8px}
  main{padding:20px 16px 48px} .split{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.comp-row{display:flex;gap:8px;margin-bottom:6px}.comp-row select,.comp-row input{flex:1}
</style>
</head>
<body>
<div id="root"></div>
<script>
"use strict";
/* ---------- מצב ---------- */
const state = { api: "", token: null, companies: [], companyId: null, user: null, demo: false, view: "login", pending: null };
/* האסימון נשמר בזיכרון בלבד (לא ב-localStorage), כדי שלא יישאר בדפדפן אחרי סגירה. */

/* ---------- עזרי DOM (בלי innerHTML: כל טקסט נכנס כ-textContent) ---------- */
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}
const root = document.getElementById("root");
function mount(node) { root.replaceChildren(node); }
function put(el, ...kids) { el.replaceChildren(...kids.filter(k => k != null && k !== false)); }
function toast(msg) {
  const t = h("div", { class: "toast", role: "status" }, msg);
  document.body.append(t); setTimeout(() => t.remove(), 3200);
}
const fmt = (v) => v == null ? null : Number(v).toLocaleString("he-IL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

/* ---------- סטטוסים: ארבעה, בלי לנחש ---------- */
function statusInfo(s) {
  // שלוש תוויות בלבד: עפ"י החוק / עפ"י רואת חשבון / מצריך בדיקה ידנית. כל שאר המצבים (כולל "לפי הקורס") = בדיקה ידנית
  s = String(s || "");
  if (s.startsWith("מאומת") || s.startsWith("לפי חוק") || s.startsWith("עפ\"י החוק")) return { cls: "s-ok", text: "עפ\"י החוק" };
  if (s.startsWith("לפי רואת חשבון") || s.startsWith("עפ\"י רואת חשבון")) return { cls: "s-law", text: "עפ\"י רואת חשבון" };
  return { cls: "s-bad", text: "מצריך בדיקה ידנית" };
}
const LABELS = { income_tax: "מס הכנסה", national_insurance: "ביטוח לאומי", health: "מס בריאות",
  pension_employee: "פנסיה (עובד)", study_fund_employee: "קרן השתלמות (עובד)", life_insurance: "ביטוח חיים",
  other_deductions: "ניכויים אחרים" };

/* ---------- API ---------- */
async function api(method, path, body, isForm) {
  if (state.demo) return demoApi(method, path, body);
  const headers = {};
  if (state.token) headers.Authorization = "Bearer " + state.token;
  if (body && !isForm) headers["Content-Type"] = "application/json";
  let res;
  try {
    res = await fetch(state.api + path, { method, headers, body: body ? (isForm ? body : JSON.stringify(body)) : undefined });
  } catch (e) { throw new Error("אין חיבור. בדקי את החיבור לאינטרנט ונסי שוב."); }
  const refreshed = res.headers.get("X-Refreshed-Token");   // חלון אי-פעילות: השרת מחדש את הטוקן בפעילות
  if (refreshed && state.token) state.token = refreshed;
  let data = null;
  try { data = await res.json(); } catch (e) { /* תשובה ריקה */ }
  if (!res.ok) {
    const d = data && data.detail;
    const msg = typeof d === "string" ? d : Array.isArray(d) ? d.map(x => x.msg).join("; ") : "הפעולה נכשלה (" + res.status + ")";
    if (res.status === 401 && state.token) { state.token = null; render("login"); }
    throw new Error(msg);
  }
  return data;
}

/* ---------- נתוני דוגמה: מסומנים בבירור, אינם חישוב אמיתי ---------- */
function demoApi(method, path, body) {
  return new Promise((resolve, reject) => setTimeout(() => {
    if (path.endsWith("/calculate-paystub")) {
      const g = Number(body.base_salary) + Number(body.bonus || 0);
      return resolve({ emp_name: body.emp_name, emp_id_number: "*****" + String(body.emp_id_number).slice(-4),
        period: body.period || (body.month + "/" + body.year), gross: g, net: g * 0.78,
        items: {
          income_tax: { value: g * 0.09, status: "לפי חוק - לא נבדק מול תלוש", note: "דוגמה בלבד: המספר אינו חישוב אמיתי." },
          national_insurance: { value: g * 0.035, status: "מאומת", note: "דוגמה בלבד." },
          health: { value: g * 0.05, status: "מאומת", note: "דוגמה בלבד." },
          pension_employee: { value: g * 0.06, status: "לפי הקורס - לא נבדק מול החוק", note: "דוגמה בלבד: שיעור הפנסיה נגזר מהקורס." },
          study_fund_employee: { value: null, status: "נדרש טיפול ידני", note: "דוגמה: מקרה שהמערכת לא מנחשת." } },
        unresolved: ["קרן השתלמות (עובד)"], flags: ["נתוני דוגמה: אין להסתמך על המספרים"], overall_status: "נדרש טיפול ידני" });
    }
    if (path.endsWith("/employees")) return resolve([
      { id: "d1", full_name: "דנה לוי (דוגמה)", id_number_masked: "*****1234", base_salary: 9800, start_date: "2022-03-01" },
      { id: "d2", full_name: "יוסי כהן (דוגמה)", id_number_masked: "*****5678", base_salary: 7400, start_date: "2024-09-15" }]);
    if (path.endsWith("/proposals")) return resolve([
      { id: "p1", kind: "form101", status: "pending", year: 2025, created_at: "2026-10-18T10:20:00", usable: false },
      { id: "p2", kind: "guideline", status: "approved", year: null, created_at: "2026-10-10T09:00:00", usable: true }]);
    if (/\/proposals\/p\d$/.test(path) && method === "GET") return resolve({ id: "p1", kind: "form101", status: "pending", year: 2025,
      fields: { tax_year: 2025, signed_on: "2025-01-05", income_type: "main", other_income: false, other_credits_claimed: false },
      ignored_fields: [], extraction: { source: "manual", notes: ["לא הוגדר מחלץ אוטומטי: נדרשת הזנה ידנית של השדות"] },
      validation: { errors: {}, warnings: ["חסרים נתוני עובד (תושבות/מין): נקודות הזיכוי לא נבדקו"], checks: {}, floor_status: "n/a" } });
    if (path.endsWith("/decision")) return resolve({ status: body.action === "approve" ? "approved" : "rejected" });
    if (path.endsWith("/rules")) return resolve([]);
    if (/\/params(\?|$)/.test(path)) return resolve({ year: 2026, label: "מעודכן ל-2026", params: [
      { name: "injury_daily_cap", year: 2026, value: "1314.25", status: "עפ\"י החוק", note: "דוגמה בלבד", overridden: false, law_value: "1314.25" }] });
    if (path.endsWith("/audit-log")) return resolve([
      { at: "2026-10-19T12:01:00", action: "login", entity: null }, { at: "2026-10-19T12:04:00", action: "calculate_paystub", entity: "paystub" }]);
    reject(new Error("לא זמין במצב דוגמה"));
  }, 150));
}

/* ---------- מסך כניסה ---------- */
function loginView(step) {
  const email = h("input", { type: "email", autocomplete: "username", required: true, id: "em" });
  const pw = h("input", { type: "password", autocomplete: "current-password", required: true, id: "pw" });
  const code = h("input", { inputmode: "numeric", autocomplete: "one-time-code", pattern: "[0-9]{6}", maxlength: "6", id: "cd" });
  const apiBase = h("input", { type: "url", placeholder: "https://…onrender.com", id: "ab", value: state.api });
  const msg = h("div", { "aria-live": "polite" });
  const needCode = step === "2fa";
  const form = h("form", { onsubmit: async (e) => {
    e.preventDefault(); msg.replaceChildren();
    state.api = apiBase.value.replace(/\/$/, "");
    try {
      const r = await api("POST", "/auth/login", { email: email.value, password: pw.value, totp_code: code.value || null });
      state.token = r.access_token; state.user = email.value;
      if (r.two_factor_setup_required) return render("enroll");
      state.companies = r.companies || []; state.companyId = state.companies[0] && state.companies[0].id;
      render(state.companyId ? "home" : "newco");
    } catch (err) {
      if (/totp|דו-שלבי/.test(err.message)) { msg.replaceChildren(h("div", { class: "info" }, "נדרש קוד מאפליקציית האימות.")); form.querySelector(".codebox").hidden = false; }
      else msg.replaceChildren(h("div", { class: "err", role: "alert" }, err.message));
    }
  } },
    h("h2", {}, "כניסה למערכת"),
    h("label", {}, "אימייל", email),
    h("label", {}, "סיסמה", pw),
    h("label", { class: "codebox", hidden: !needCode }, "קוד אימות דו-שלבי (6 ספרות)", code),
    msg,
    h("button", { class: "btn", type: "submit" }, "כניסה"),

function reviewView() {
  const all = state.flow.results;
  if (!all.length) return shell("review", "2. בדיקה ואישור", h("div", {}, flowBar(2), h("div", { class: "empty" }, "עוד אין תלושים לבדיקה. מתחילים בשלב 1."),

  };
  stSel.addEventListener("change", draw); q.addEventListener("input", draw);
  api("GET", "/sources").then(r => { rows = r; draw(); }).catch(e => box.replaceChildren(h("div", { class: "err", role: "alert" }, e.message)));
  return shell("sources", "מקורות החוק", h("div", {},
    h("p", {}, "כל כלל שהמערכת מחשבת לפיו, והחוק והסעיף שלו. 'עפ\"י החוק' = נקרא ממקור רשמי. 'עפ\"י רואת חשבון' = ללא נוסח חוק שנמצא. 'נדרש טיפול ידני' = אין מקור, ולכן המערכת לא מחשבת. סעיף שלא נקרא מסומן 'לא תועד', ואינו מנוחש."),
    h("div", { class: "row2" }, h("label", {}, "סטטוס", stSel), h("label", {}, "חיפוש", q)), box));
}


/* ---------- משוב ---------- */
function feedbackView() {
  const area = h("select", {}, [["general", "כללי"], ["calc", "החישוב"], ["law", "החוק והמקורות"], ["screens", "המסכים והשימוש"], ["other", "אחר"]].map(([v, t]) => h("option", { value: v }, t)));
  const text = h("textarea", { rows: 6, required: true, minlength: 3, maxlength: 2000, placeholder: "מה לא נראה נכון, מה חסר, מה היה מבלבל. בלי שמות או ת״ז אמיתיים." });
  const msg = h("div", { "aria-live": "polite" });
  const form = h("form", { onsubmit: async (e) => {
    e.preventDefault(); msg.replaceChildren();
    try { await api("POST", cp("/feedback"), { area: area.value, text: text.value }); text.value = ""; msg.replaceChildren(h("div", { class: "info" }, "תודה, המשוב נקלט.")); }
    catch (err) { msg.replaceChildren(h("div", { class: "err", role: "alert" }, err.message)); }
  } }, h("label", {}, "נושא", area), h("label", {}, "המשוב שלך", text), msg, h("button", { class: "btn", type: "submit" }, "שליחה"));
  return shell("feedback", "משוב", h("div", {}, h("p", {}, "הניסוי נועד לבדוק אם החישוב נכון ואם המסכים ברורים. כל הערה עוזרת."), form));
}

/* ---------- מסך הבית: שלושה צעדים ---------- */
function reportsView() {
  const f = {};
  const out = h("div", { "aria-live": "polite" });
  const field = (name, label, attrs) => { f[name] = h("input", Object.assign({ name, required: true }, attrs || {})); return h("label", {}, label, f[name]); };
  const pick = (name, label, opts) => { f[name] = h("select", { name }, opts.map(([v, t]) => h("option", { value: v }, t))); return h("label", {}, label, f[name]); };
  const params = () => ({ year: +f.year.value, hebrew_visual: f.order.value === "visual", encoding: f.enc.value });
  const profileBody = () => ({ file_no: f.file_no.value.trim(), agid: +f.agid.value || 0, factory_no: f.factory_no.value.trim() || null,
    legal_status: +f.legal_status.value, tax_file_no: f.tax_file_no.value.trim(), name: f.name.value.trim(),
    phone: f.phone.value.trim(), employer_tax: +f.employer_tax.value });
  const load = async () => {
    try {
      const p = await api("GET", cp("/profile"));
      Object.keys(p).forEach(k => { if (f[k] && p[k] != null) f[k].value = p[k]; });
    } catch (e) { /* אין עדיין פרטים */ }
  };
  const saveProfile = async () => { await api("PUT", cp("/profile"), profileBody()); };
  const profileOk = () => ["name", "file_no", "tax_file_no", "phone"].every(k => f[k].value.trim());
  const status = (kind, title, sub) => h("div", { class: "rep-status " + kind, role: kind === "ok" ? "status" : "alert" }, h("strong", {}, title), sub ? h("span", {}, sub) : null);
  const showIssues = (r) => {
    const blocks = r.issues.filter(i => i.level === "block"), warns = r.issues.filter(i => i.level !== "block");
    const li = (i) => h("li", {}, (i.scope ? i.scope + ": " : "") + i.text);
    const list = (arr, title) => {
      if (!arr.length) return null;
      const shown = arr.slice(0, 5), rest = arr.slice(5);
      return h("details", { class: "rep-list", open: title === "blocks" }, h("summary", {}, (title === "blocks" ? "מה צריך להשלים (" : "לבדיקה שלך (") + arr.length + ")"),
        h("ul", {}, shown.map(li)), rest.length ? h("details", {}, h("summary", {}, "עוד " + rest.length), h("ul", {}, rest.map(li))) : null);
    };
    return [r.submittable ? status("ok", "הדוח מוכן להורדה", r.records + " רשומות") : status("warn", "הדוח כמעט מוכן", "יש " + blocks.length + " דברים להשלים לפני שמגישים; אפשר להוריד טיוטה"),
      list(blocks, "blocks"), list(warns, "warns")];
  };
  const run = async (doDownload) => {
    if (!profileOk()) { profileBox.open = true; out.replaceChildren(status("warn", "חסרים פרטי המעביד", "הכי נוח: למלא פעם אחת בגיליון 'מעביד' בתבנית האקסל (שלב 1). אפשר גם כאן: שם, תיק ניכויים, מספר תיק במס הכנסה וטלפון.")); return; }
    out.replaceChildren(h("p", { class: "muted" }, doDownload ? "מכינה את הקובץ…" : "בודקת…"));
    try {
      await saveProfile();
      if (!doDownload) { out.replaceChildren(...showIssues(await api("POST", cp("/reports/126/check"), params())).filter(Boolean)); return; }
      const res = await fetch(state.api + cp("/reports/126/file"), { method: "POST", headers: { "Authorization": "Bearer " + state.token, "Content-Type": "application/json" }, body: JSON.stringify(params()) });
      if (!res.ok) { let m = "הפעולה נכשלה (" + res.status + ")"; try { const j = await res.json(); if (typeof j.detail === "string") m = j.detail; } catch (e) {} throw new Error(m); }
      const draft = res.headers.get("X-Report-Draft") === "true";
      const url = URL.createObjectURL(await res.blob());
      const r = await api("POST", cp("/reports/126/check"), params());
      out.replaceChildren(...showIssues(r).filter(Boolean), h("a", { class: "btn", href: url, download: "126-" + f.year.value + (draft ? "-DRAFT" : "") + ".txt" }, draft ? "הורדת טיוטה" : "הורדת הקובץ"));
    } catch (err) { out.replaceChildren(h("div", { class: "err", role: "alert" }, err.message)); }
  };
  const payOut = h("div", { "aria-live": "polite" });
  const payments = async () => {
    payOut.replaceChildren(h("p", { class: "muted" }, "מסכמת…"));
    try {
      const r = await api("GET", cp("/payments-summary?year=" + encodeURIComponent(f.year.value)));
      if (!r.months.length) { payOut.replaceChildren(h("p", { class: "muted" }, "אין עדיין תלושים לשנה הזו.")); return; }
      const n = (v) => Number(v).toLocaleString("he-IL", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const rows = r.months.map(m => h("tr", {}, h("td", {}, String(m.month)), h("td", {}, String(m.employees)), h("td", {}, n(m.income_tax)),
        h("td", {}, n(m.btl_total)), h("td", {}, m.btl_deadline), h("td", {}, n(m.pension_employer + m.severance_employer + m.study_fund_employer))));
      payOut.replaceChildren(h("table", {}, h("thead", {}, h("tr", {}, ["חודש", "עובדים", "מס הכנסה", "ביטוח לאומי ובריאות", "מועד ב\"ל", "פנסיה/פיצויים/השתלמות"].map(t => h("th", {}, t)))), h("tbody", {}, rows)),
        h("p", { class: "muted" }, "מועד מס הכנסה ופנסיה: נדרש טיפול ידני (אין מקור). ההעברה בבנק נעשית בידי חשבת השכר."));
    } catch (err) { payOut.replaceChildren(h("div", { class: "err", role: "alert" }, err.message)); }
  };
  const profileBox = h("details", { class: "rep-details" }, h("summary", {}, "פרטי המעביד (ממלאים פעם אחת)"),
    h("div", { class: "rep-grid" },
      field("name", "שם המעביד", { maxlength: 18 }),
      field("file_no", "תיק ניכויים", { pattern: "9[0-9]{8}", inputmode: "numeric" }),
      field("tax_file_no", "מספר תיק במס הכנסה", { inputmode: "numeric" }),
      field("phone", "טלפון", { inputmode: "numeric" }),
      pick("legal_status", "מעמד משפטי", [[1, "חברה"], [2, "יחיד"], [3, "שותפות"], [4, "עמותה"], [5, "רשות"]]),
      pick("employer_tax", "מס מעסיקים", [[1, "פטור"], [2, "חייב"]]),
      field("agid", "מספר אגיד (0 אם אין)", { inputmode: "numeric", value: "0" }),
      h("label", {}, "מספר מפעל (לא חובה)", (f.factory_no = h("input", { name: "factory_no", inputmode: "numeric" })))));
  const tech = h("details", { class: "rep-details" }, h("summary", {}, "הגדרות טכניות (ברירת המחדל מתאימה)"),
    h("div", { class: "rep-grid" },
      pick("enc", "קידוד עברית", [["cp1255", "ASCII WINDOWS"], ["cp862", "ASCII NEW CODE"]]),
      pick("order", "סדר אותיות", [["logical", "רגיל"], ["visual", "הפוך"]])),
    h("p", { class: "muted" }, "המפרט של הרשות לא מכריע בסדר האותיות; לאמת בבדיקת הקובץ של הרשות."));
  f.year = h("select", { name: "year", "aria-label": "שנת מס" }, [0, 1, 2].map(i => { const y = new Date().getFullYear() - i; return h("option", { value: String(y) }, String(y)); }));
  f.year.value = String(new Date().getFullYear() - 1);
  f.year.addEventListener("change", () => { out.replaceChildren(); payments(); });
  load().then(() => { if (!profileOk()) profileBox.open = true; else run(false); });
  payments();
  return shell("reports", "4. דיווחים לרשויות", h("div", {}, flowBar(4),
    h("p", { class: "muted" }, "המערכת מכינה את קובץ הדוח השנתי (טופס 126) מהתלושים. ההגשה לרשות נעשית בידי חשבת השכר. נתוני דמה בלבד."),
    h("section", { class: "rep-card" }, h("div", { class: "rep-head" }, h("h3", {}, "דוח שנתי למס הכנסה (126)"), h("label", { class: "rep-year" }, "שנת מס", f.year)),
      profileBox, tech, h("div", { class: "actions" }, h("button", { class: "btn", type: "button", onclick: () => run(true) }, "הפקת דוח לרשויות"), h("button", { class: "btn ghost", type: "button", onclick: () => run(false) }, "בדיקה מחדש")), out),
    h("section", { class: "rep-card" }, h("h3", {}, "סיכום תשלומים לפי חודש"), payOut)));
}

function homeView() {
  const step = (n, title, text, label, view) => h("section", { class: "flow-step" },
    h("div", { class: "flow-n", "aria-hidden": "true" }, n), h("h3", {}, title), h("p", {}, text),
    h("button", { class: "btn", type: "button", onclick: () => render(view) }, label));
  return shell("home", "תהליך עבודה",
    h("div", {},
      h("p", {}, "כל החישוב נעשה לפי החוק. אין צורך לחשב ידנית: בכל תוצאה מופיעים הסטטוס והמקור שלה (איזה חוק, איזה סעיף), ואת מה שאין לו מקור המערכת לא מנחשת ומסמנת לטיפול ידני."),
      h("div", { class: "flow" },
        step("1", "העלאת אקסל וטופס 101", "קובץ אחד: העובדים, טופס 101 של כל עובד ונתוני החודש. המערכת קולטת וקובעת את הכול בשרת.", "להעלאת אקסל", "upload"),
        step("2", "בדיקה ואישור", "חשבת השכר בודקת את הסכום ואת החוק והסעיף בכל שורה, ומאשרת.", "לבדיקה ואישור", "review"),
        step("3", "הפקת תלוש לפי תבנית", "מפיקים את התלושים המאושרים בתבנית שנבחרה.", "להפקה", "issue"),
        step("4", "דיווחים לרשויות", "מכינים קובץ דיווח שנתי (טופס 126) מהתלושים. המערכת בודקת מה חסר, ואת הקובץ מגישה חשבת השכר בעצמה.", "לדיווחים", "reports"))));
}

function render(view) {
  state.view = view;
  const views = { home: homeView, f101: form101View, term: terminationView, slip: slipPageView, upload: uploadView, uploadadv: uploadAdvancedView, review: reviewView, issue: issueView, reports: reportsView, login: () => loginView(), register: registerView, newco: newcoView, chpw: chpwView, enroll: enrollView, calc: calcView, emps: empsView, props: propsView, prop: propView, rules: rulesView, audit: auditView, params: paramsView, sources: sourcesView, feedback: feedbackView };
  mount(views[view]());
  window.scrollTo(0, 0);
}
render("login");
</script>
</body>
</html>
