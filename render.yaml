# סביבת בדיקות (נתונים בדיוניים בלבד). שירות נפרד מהדמו הישן; משתמש באותו מסד אבל בסכמה נפרדת (DB_SCHEMA).
services:
  - type: web
    name: payroll-live
    runtime: python
    plan: free
    region: oregon
    branch: dev-components
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main_api:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payroll-test-db
          property: connectionString
      - key: DB_SCHEMA
        value: components
      - key: JWT_SECRET
        generateValue: true
      - key: FIELD_KEY
        sync: false
      - key: ENV
        value: demo
      - key: REQUIRE_2FA
        value: "false"
      - key: REGISTRATION_OPEN
        value: "true"
      - key: PYTHON_VERSION
        value: 3.12.7
